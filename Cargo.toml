[package]
name = "ledger-agent"
version = "2.0.0"
edition = "2021"
description = "LedgerAgent portable MCP server — ROI gate, ledger, memory, scout/browser bridges"
license = "Proprietary"

[[bin]]
name = "ledger-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
rmcp = { version = "3.10", features = [] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
regex = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
home = "0.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# tests use only std + dependencies above
